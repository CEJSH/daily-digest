<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO 메타 태그 -->
    <!--
      SEO 규칙:
      - title: PICKY — 오늘의 핵심 뉴스 5개 (또는 PICKY · YYYY.MM.DD)
      - description: 3분 만에 하루를 정리하는 뉴스 요약
    -->
    <title>PICKY — 오늘의 핵심 뉴스 5개</title>
    <meta name="description" content="PICKY는 하루 5개의 핵심 뉴스만 정리해드립니다. 3분 만에 오늘 하루를 파악하세요. 클릭 수가 아닌 내일에도 남는 정보만 선별합니다." />
    <meta name="author" content="PICKY" />
    <meta name="keywords" content="PICKY, 뉴스 요약, 핵심 뉴스, 뉴스 큐레이션, 오늘의 뉴스, 3분 뉴스" />

    <!-- Open Graph -->
    <meta property="og:title" content="PICKY — 오늘의 핵심 뉴스 5개" />
    <meta property="og:description" content="하루 5개의 핵심 뉴스만 정리해드립니다. 3분 만에 오늘 하루를 파악하세요." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="PICKY" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PICKY — 오늘의 핵심 뉴스 5개" />
    <meta name="twitter:description" content="3분 만에 하루를 정리하는 뉴스 요약" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <!--
      Font loading optimization:
      - preconnect로 DNS+TLS handshake 선행 (~100-300ms 단축).
      - <link rel="stylesheet">로 parallel 로드 (CSS @import의 serial 비용 회피).
      - 사용 중인 weight만 로드 (Playfair/Noto Serif KR: 400/500/700 — 3종).
        Pretendard는 단일 CSS로 전체 weight를 받지만 한 파일이라 큰 부담 없음.
      - display=swap으로 폰트 다운로드 동안 시스템 폰트로 즉시 그림(FOIT 방지).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" />

    <!--
      Dark mode pre-paint: read user preference before React hydrates
      to prevent a light → dark flash for dark-mode users.
      Storage key must stay in sync with src/components/news/ThemeSwitcher.tsx.
    -->
    <script>
      (function () {
        try {
          var KEY = 'dd.v1.theme';
          var LEGACY = 'news-theme-mode';
          var stored = localStorage.getItem(KEY);
          if (stored !== 'light' && stored !== 'dark') {
            var legacy = localStorage.getItem(LEGACY);
            if (legacy === 'light' || legacy === 'dark') {
              stored = legacy;
              localStorage.setItem(KEY, legacy);
              localStorage.removeItem(LEGACY);
            }
          }
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage may throw in private/locked-down contexts; ignore */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
